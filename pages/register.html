<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create account — ThinkMart</title>
    <link rel="stylesheet" href="../Styles/store.css">
    <script src="../scripts/store.js" defer></script>
</head>
<body data-page="register">
    <div id="site-header"></div>
    <main class="auth-wrap">
        <section class="content-panel auth-card">
            <p class="eyebrow">A little more personal</p>
            <h1 style="font-size:42px">Create account</h1>
            <p>Save a demo account to see your past orders on this browser.</p>
            <form id="register-form" class="form-stack">
                <label class="field" for="register-name">Your name
                    <input id="register-name" name="name" autocomplete="name" required minlength="2" maxlength="80">
                </label>
                <label class="field" for="register-email">Email
                    <input id="register-email" name="email" type="email" autocomplete="email" required maxlength="254">
                </label>
                <label class="field" for="register-password">Password
                    <input id="register-password" name="password" type="password" autocomplete="new-password" required minlength="8" maxlength="128">
                </label>
                <button class="button" type="submit">Create account</button>
                <p class="form-status" role="status" aria-live="polite"></p>
            </form>
            <p class="auth-links">Already have an account? <a class="text-link" href="login.html">Sign in</a></p>
            <p class="summary-note">Demo accounts are stored in this browser only. Do not reuse a real password.</p>
        </section>
    </main>
    <div id="site-footer"></div>
    <div id="live-status" role="status"></div>
</body>
</html>
