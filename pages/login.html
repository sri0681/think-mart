<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in — ThinkMart</title>
    <link rel="stylesheet" href="../Styles/store.css">
    <script src="../scripts/store.js" defer></script>
</head>
<body data-page="login">
    <div id="site-header"></div>
    <main class="auth-wrap">
        <section class="content-panel auth-card">
            <p class="eyebrow">Welcome back</p>
            <h1 style="font-size:42px">Sign in</h1>
            <p>Sign in to see orders linked to your demo account. You can also shop and check out as a guest.</p>
            <form id="login-form" class="form-stack">
                <label class="field" for="login-email">Email
                    <input id="login-email" name="email" type="email" autocomplete="email" required maxlength="254">
                </label>
                <label class="field" for="login-password">Password
                    <input id="login-password" name="password" type="password" autocomplete="current-password" required minlength="8" maxlength="128">
                </label>
                <button class="button" type="submit">Sign in</button>
                <p class="form-status" role="status" aria-live="polite"></p>
            </form>
            <p class="auth-links">New to ThinkMart? <a class="text-link" href="register.html">Create a demo account</a></p>
            <p class="summary-note">Demo accounts are stored in this browser only. Do not reuse a real password.</p>
        </section>
    </main>
    <div id="site-footer"></div>
    <div id="live-status" role="status"></div>
</body>
</html>
