spring.application.name=thinkmart
spring.config.import=optional:file:./.env[.properties]
spring.datasource.url=${MYSQL_URL:jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:thinkmart}?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&sslMode=PREFERRED&serverTimezone=UTC}
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:}
spring.sql.init.mode=always
server.forward-headers-strategy=framework
server.error.include-message=never
